name: build-plasma-machine

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "00 06 * * *" # daily, to track upstream Bazzite updates
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  IMAGE_NAME: plasma-machine
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          build_chunked_oci: true

  # GitHub disables scheduled workflows after 60 days without repo activity.
  # Re-enabling an already-enabled workflow resets that timer, so the daily
  # cron keeps itself alive without dummy commits.
  keepalive:
    name: Keep schedule alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
